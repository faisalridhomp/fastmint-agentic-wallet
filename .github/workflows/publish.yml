name: Publish to GitHub Packages

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'fire.js'
      - 'lib.js'
      - 'recon.js'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
      - run: npm publish || echo "publish skipped (this version may already exist — bump version in package.json to release again)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
